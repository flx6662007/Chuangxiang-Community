<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link id="site-favicon" rel="icon" type="image/svg+xml" data-base="%BASE_URL%" />
    <script>
      // Apply before styles and Vue load; keep the key in sync with utils/theme.js.
      (() => {
        let saved
        try { saved = localStorage.getItem('chuangxiang-theme') } catch {}
        const theme = saved === 'dark' || saved === 'light'
          ? saved : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        const favicon = document.getElementById('site-favicon')
        favicon.href = `${favicon.dataset.base}favicon-${theme}.svg`
      })()
    </script>
    <style>
      html { background: #0b111b; }
      html[data-theme="light"] { background: #f2f1ed; }
    </style>
    <title>创享平台</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
